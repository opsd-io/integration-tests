version: 1
provider: digitalocean

# Keep this file public: it describes only compatibility combinations and
# synthetic plan scenarios. Credentials and real infrastructure belong in the
# private integration workflow.
cli_refs:
  - current

iac_tools:
  - terraform
  - tofu

modules:
  digitalocean:
    refs:
      - main

scenario_generation:
  base:
    blueprint: kubernetes-foundation
    variant: kubernetes
  lifecycle:
    id: digitalocean-kubernetes-lifecycle
    metadata:
      version_upgrade:
        kubernetes: true
        databases: [mysql, postgres, valkey]
    base_modules: [vpc, project, kubernetes]
    # These are the modules currently emitted by the Kubernetes renderer.
    required_modules:
      - vpc
      - project
      - kubernetes
      - managed-mysql
      - managed-postgres
      - managed-valkey
    steps:
      - id: add-mysql
        command: [add, database, mysql]
        args: [--id, database-mysql]
        covers: [managed-mysql]
      - id: add-postgres
        command: [add, database, postgres]
        args: [--id, database-postgres]
        covers: [managed-postgres]
      - id: add-valkey
        command: [add, cache, valkey]
        args: [--id, cache-valkey]
        covers: [managed-valkey]
      - id: remove-mysql
        command: [remove, database]
        args: [database-mysql]
        covers: [managed-mysql]
