version: 1
provider: digitalocean

# Keep this file public: it describes only compatibility combinations and
# synthetic plan scenarios. Credentials and real infrastructure belong in the
# private integration workflow.
cli_refs:
  - current

iac_tools:
  - terraform
  - tofu

modules:
  digitalocean:
    refs:
      - main

scenario_generation:
  base:
    blueprint: kubernetes-foundation
    variant: kubernetes
  lifecycle:
    id: digitalocean-kubernetes-lifecycle
    manifest_overrides:
      kubernetes_config:
        kubernetes_version: 1.33.1-do.0
        vpc_ip_range: 10.239.0.0/20
        cluster_subnet: 10.240.0.0/16
        service_subnet: 10.241.0.0/19
      components:
        infrastructure:
          gateway-api:
            enabled: true
            values:
              public:
                enabled: false
              private:
                enabled: false
    metadata:
      version_upgrade:
        kubernetes: true
        databases: [mysql, postgres, valkey]
    base_modules: [vpc, project, kubernetes]
    # These are the modules currently emitted by the Kubernetes renderer.
    required_modules:
      - vpc
      - project
      - kubernetes
      - managed-mysql
      - managed-postgres
      - managed-valkey
    steps:
      - id: add-mysql
        command: [add, database, mysql]
        args: [--id, database-mysql]
        covers: [managed-mysql]
      - id: add-postgres
        command: [add, database, postgres]
        args: [--id, database-postgres]
        covers: [managed-postgres]
      - id: add-valkey
        command: [add, cache, valkey]
        args: [--id, cache-valkey]
        covers: [managed-valkey]
      - id: remove-mysql
        command: [remove, database]
        args: [database-mysql]
        covers: [managed-mysql]
    gateway_scenarios:
      - id: digitalocean-gateway-public
        enabled_profiles: [public]
        execution_modes: [plan]
        iac_tools: [render-only]
      - id: digitalocean-gateway-private
        enabled_profiles: [private]
        execution_modes: [plan]
        iac_tools: [render-only]
      - id: digitalocean-gateway-tls
        enabled_profiles: [public]
        hostnames:
          public: gateway.example.test
        acme:
          email: certs@example.test
          server: staging
        execution_modes: [plan]
        iac_tools: [render-only]
    external_dns_scenario:
      id: digitalocean-external-dns
      values:
        domain_filters: [example.test]
        txt_owner_id: opsd-ci
        token_secret_name: digitalocean-dns
        policy: upsert-only
      execution_modes: [plan]
      iac_tools: [render-only]
    external_secrets_scenario:
      id: digitalocean-external-secrets
      execution_modes: [plan]
      iac_tools: [render-only]
